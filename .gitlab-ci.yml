stages:
  - test
  - build

default:
  image: python:3.12-slim

test:
  stage: test
  script:
    - python -m unittest discover -s tests
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH == "develop"

build_release:
  stage: build
  script:
    - python scripts/build-release.py --versioned
  artifacts:
    paths:
      - dist/*.zip
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG
